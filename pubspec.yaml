name: yummy
description: Yummy is a food platform for customers to order food from a wide variety of restaruants

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.0.1
  url_launcher: ^6.2.1
  uuid: ^4.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  firebase_auth: ^4.14.1
  firebase_core: ^2.23.0
  cloud_firestore: ^4.13.2
  
  # Функции из проекта Recipes
  cupertino_icons: ^1.0.9
  logging: ^1.3.0
  auto_size_text: ^3.0.0
  flutter_adaptive_scaffold: ^0.1.7+1
  desktop_window: ^0.4.2
  path: ^1.9.1
  cached_network_image: ^3.4.1
  flutter_slidable: ^4.0.3
  platform: ^3.1.6
  freezed_annotation: ^2.4.4
  http: ^1.2.1
  chopper: ^6.1.4
  flutter_svg: ^2.2.4
  json_annotation: ^4.9.0
  flutter_html: ^3.0.0
  flutter_riverpod: ^2.4.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.6
  json_serializable: ^6.8.0
  chopper_generator: ^6.0.3
  freezed: ^2.4.5

dependency_overrides:
  win32: ^5.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/categories/
    - assets/bookstores/
    - assets/profile_pics/
    - assets/food/
    - assets/images/
    - assets/book_store_header.png
